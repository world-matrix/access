        fill="none" stroke="#ffffff" stroke-width="2" opacity=".85"/>
  <g fill="#ffffff">
    <rect x="8"  y="10" width="24" height="3" rx="1.5"/>
    <rect x="8"  y="15.5" width="24" height="3" rx="1.5" opacity=".8"/>
    <rect x="8"  y="21" width="16" height="3" rx="1.5" opacity=".6"/>
    <rect x="8"  y="26.5" width="10" height="3" rx="1.5" opacity=".4"/>
  </g>
</svg>
