<?xml version="1.0" encoding="UTF-8"?>
<!--
  占位 Logo。显示在蓝色横幅左侧，高度 30px，宽度自适应。
  替换成你的美术资源时保持这个文件名即可，index.html 不用改。
  横幅是深蓝底，所以图形请用白色或浅色。
-->
